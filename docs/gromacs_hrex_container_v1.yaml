build_contract:
  gromacs_mpi: true
  gromacs_thread_mpi: false
  gromacs_gpu: CUDA
  cuda_target_sm: "89"
  cuda_target_compute: "89"
  simd: AVX2_256
  runtime_packages: [ca-certificates, grep, libgcc, libgomp, libstdc++, libxml2, numactl-libs, zlib]
  required_fragments:
    - "From: nvidia/cuda:12.8.0-devel-rockylinux8"
    - "From: nvidia/cuda:12.8.0-runtime-rockylinux8"
    - "GMX_MPI=ON"
    - "GMX_THREAD_MPI=OFF"
    - "GMX_GPU=CUDA"
    - "GMX_CUDA_TARGET_SM=89"
    - "GMX_CUDA_TARGET_COMPUTE=89"
    - "GMX_SIMD=AVX2_256"
    - "--with-cuda=/usr/local/cuda"
    - "gmx_mpi --version"
    - "production_authorized false"
    - "deployment_scope single_node_only"
  forbidden_fragments:
    - qsub
    - "-multidir"
    - "-replex"

runtime_contract:
  deployment_scope: single_node_only
  launcher: container_internal_openmpi
  openmpi_plm: isolated
  openmpi_session_tmpdir: /tmp
  mpi_ranks: 20
  lambda_states: 20
  ranks_per_state: 1
  candidate_sge_parallel_environment: mpi32
  candidate_host_count: 1
  candidate_gpu_count: 4
  gpu_model: L40S
  gpu_visibility_source: scheduler_cuda_visible_devices
  host_container_mpi_interoperation_required: false

admission:
  ready_to_build: true
  eligible_now: false
  blockers:
    - The SIF has not been built or hashed on an SCC build node.
    - The resulting gmx_mpi identity and linked libraries have not been captured.
    - A separately authorized non-production GPU smoke test has not confirmed that the SCC wrapper exposes all four reserved L40S devices.
    - Five ranks per GPU require verified GPU sharing; Exclusive_Process mode requires an admitted MPS setup or another supported solution.
    - Multidir/replex, restart, exchange-history parsing, accounting, and storage gates remain unresolved.
  prohibited:
    - production submission
    - protein simulation
    - multi-host launch
    - treating definition validation as runtime qualification

