# Corrected, frozen work-package B CPU calibration design. V1 is preserved as a
# rejected technical rehearsal because it omitted correlation treatment.
analysis_id: known_answer_model_v2
output_dir: results/cpu_calibration/known_answer_model_v2

domain:
  x: [-5.0, 5.0]
  y: [-2.5, 2.5]

lambda_vector: [0.0, 0.1111111111111111, 0.2222222222222222,
  0.3333333333333333, 0.4444444444444444, 0.5555555555555556,
  0.6666666666666666, 0.7777777777777778, 0.8888888888888888, 1.0]

potential:
  x_force_constant: 3.0
  x_lambda_shift: 1.0
  x_y_coupling: 0.7
  base_y_tilt: 0.35
  lambda_y_tilt: 2.0
  lambda_offset: 1.25

regimes:
  easy:
    barrier_height: 1.5
    barrier_relief: 0.50
  metastable:
    barrier_height: 8.0
    barrier_relief: 0.85

reference:
  gauss_legendre_orders: [48, 96, 192, 384]
  relative_free_energy_tolerance_kT: 1.0e-8
  independent_absolute_tolerance: 1.0e-10
  independent_relative_tolerance: 1.0e-10
  independent_agreement_tolerance_kT: 1.0e-7

sampling:
  methods: [independent_windows, neighbor_replica_exchange]
  potential_evaluation_budget: 60000
  snapshot_stride_sweeps: 10
  burn_fraction: 0.20
  exchange_interval_sweeps: 10
  proposal_sigma_x: 0.60
  proposal_sigma_y: 0.25
  initial_y: -1.0
  initial_sigma_x: 0.10
  initial_sigma_y: 0.05
  development_seeds: [3101, 3102, 3103, 3104]
  heldout_seeds: [4101, 4102, 4103, 4104, 4105, 4106, 4107, 4108,
    4109, 4110, 4111, 4112, 4113, 4114, 4115, 4116]

analysis:
  fixed_burn_only: true
  correlation_treatment: max_statistical_inefficiency_of_y_and_sampled_state_energy
  fit_each_block_independently: true

# Constructed-model rules only; not transferable protein thresholds. Low selected
# counts remain visible rather than causing selective replacement of a seed.
evaluation:
  nominal_interval_z: 1.96
  error_tolerance_kT: 0.50
  reassuring_net_hysteresis_max_kT: 0.25
  reassuring_min_overlap_min: 0.03
  reassuring_interval_halfwidth_max_kT: 0.50
  minimum_samples_per_state: 5

figures:
  dpi: 160
